
<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>আমার ক্যাশ - স্মার্ট ডিজিটাল ওয়ালেট</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --color-primary-hsl: 333 84% 48%;
        --app-bg: #F8FAFC;
        --card-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.04);
        --glass-bg: rgba(255, 255, 255, 0.8);
      }

      .dark {
        --app-bg: #0F172A;
        --card-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.4);
        --glass-bg: rgba(30, 41, 59, 0.8);
      }

      html {
        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
        background-color: var(--app-bg);
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        user-select: none;
        overflow-x: hidden;
      }

      /* Premium Scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Visual Polish */
      .shadow-premium { box-shadow: var(--card-shadow); }
      .backdrop-blur-glass { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: var(--glass-bg); }
      
      .gradient-primary {
        background: linear-gradient(135deg, hsl(var(--color-primary-hsl)), hsl(var(--color-primary-hsl) / 0.8));
      }

      /* Fix for dynamic HSL colors in Tailwind CDN */
      .bg-primary { background-color: hsl(var(--color-primary-hsl)); }
      .text-primary { color: hsl(var(--color-primary-hsl)); }
      .border-primary { border-color: hsl(var(--color-primary-hsl)); }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: 'hsl(var(--color-primary-hsl) / <alpha-value>)',
                light: 'hsl(var(--color-primary-hsl) / 0.8)',
                dark: 'hsl(var(--color-primary-hsl) / 1.2)',
              },
              slate: {
                50: '#F8FAFC',
                100: '#F1F5F9',
                200: '#E2E8F0',
                800: '#1E293B',
                900: '#0F172A',
              },
              dark: {
                bg: '#0F172A',      
                surface: '#1E293B', 
                border: '#334155', 
                text: '#F1F5F9',   
                subtext: '#94A3B8',
              }
            },
            borderRadius: {
              'card': '2rem',
              'button': '1.25rem',
            },
          },
        },
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
  }
}
</script>
  </head>
  <body class="bg-slate-50 dark:bg-dark-bg text-slate-900 dark:text-dark-text">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
