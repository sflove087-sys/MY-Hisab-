
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ডিজিটাল ওয়ালেট - স্মার্ট লেনদেন</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --color-primary-hsl: 333 84% 48%; /* bKash Pink Default */
        --radius-sure: 0.5rem;
      }

      html {
        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #F1F2F3;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .shadow-premium {
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
      }

      .page-enter {
        animation: fadeIn 0.4s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Fix for dynamic HSL colors in Tailwind CDN */
      .bg-primary { background-color: hsl(var(--color-primary-hsl)); }
      .text-primary { color: hsl(var(--color-primary-hsl)); }
      .border-primary { border-color: hsl(var(--color-primary-hsl)); }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: 'hsl(var(--color-primary-hsl) / <alpha-value>)',
                light: 'hsl(var(--color-primary-hsl) / 0.8)',
                dark: 'hsl(var(--color-primary-hsl) / 1.2)',
              },
              dark: {
                bg: '#0F172A',      
                surface: '#1E293B', 
                border: '#334155', 
                text: '#F1F5F9',   
                subtext: '#94A3B8',
              }
            },
            borderRadius: {
              'wallet': 'var(--radius-sure)',
              '4xl': '2.5rem',
            },
          },
        },
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
      }
    }
    </script>
  </head>
  <body class="bg-[#F1F2F3] dark:bg-dark-bg text-slate-900 dark:text-dark-text overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
